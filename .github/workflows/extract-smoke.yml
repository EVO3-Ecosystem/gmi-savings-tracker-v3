# The full pipeline in GitHub Actions: extract from the portal, build, check, and keep the evidence.
# Runs on the 3rd of each month (Phase 6: scheduled runs with no manual steps) and when started by hand.
# A scheduled run only fires from the default branch. MD_SODA_APP_TOKEN is optional (decision D5 was revised): the
# datasets are public and SODA 2.1 serves them without a token. A valid token only raises the request limits; a
# rejected one is dropped with a warning and the run continues. BLS_API_KEY is optional too.
# The raw data is cached, keyed on the portal's own update dates, so a run when nothing has changed reuses it.
name: Extract and build
on:
  workflow_dispatch:
  schedule:
    - cron: "23 7 3 * *"
permissions:
  contents: read
  issues: write
concurrency:
  group: extract-build
  cancel-in-progress: false
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GMI_SCHEDULED: ${{ github.event_name == 'schedule' && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.lock.txt && pip install --no-deps -e .
      - name: Portal update dates (the cache key; needs no token)
        id: portal
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib, os, urllib.request, json
          from src.pipeline import extract
          parts = []
          try:
              for name, spec in extract.CFG["datasets"].items():
                  url = f"https://{extract.CFG['domain']}/api/views/{spec['id']}.json"
                  with urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "gmi-savings-tracker-cache-key"}), timeout=30) as r:
                      parts.append(f"{name}:{json.load(r)['rowsUpdatedAt']}")
              key = hashlib.sha256("|".join(parts).encode()).hexdigest()[:16]
          except Exception as e:  # no key means no cache hit: the run simply downloads everything
              key = "nocache-" + os.environ.get("GITHUB_RUN_ID", "local")
          print("key=" + key)
          PY
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            data/raw
            data/runs.csv
          key: raw-${{ steps.portal.outputs.key }}
          restore-keys: raw-
      - run: python -m src.pipeline.extract
        env: {MD_SODA_APP_TOKEN: "${{ secrets.MD_SODA_APP_TOKEN }}", BLS_API_KEY: "${{ secrets.BLS_API_KEY }}"}
      - name: Keep only the newest raw run (that is what the cache stores)
        run: ls -1d data/raw/*/ | sort | head -n -1 | xargs -r rm -rf
      - name: Build and check
        id: build
        run: python -m src.pipeline.build
        env: {BLS_API_KEY: "${{ secrets.BLS_API_KEY }}"}
      - name: Verify the fiscal-year datamart bundle (local only)
        run: python -m src.pipeline.datamarts
      - name: Model evaluation tables (also after a failed build)
        if: always() && steps.build.conclusion != 'skipped'
        run: python -m src.pipeline.review_tables data/review | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Regenerate the README and model-note facts from this run
        # a new run has a new as-of date and new counts; the README test then checks the generators against this run's data
        run: python -m src.models.doc_facts
      - run: pytest -q
      - name: Reconcile with the Transparency Portal downloads
        run: python -m src.pipeline.reconcile --strict
      - run: python -m src.pipeline.figures
      - name: Data governance (schemas, coverage, drift)
        run: python -m src.pipeline.governance --strict
        continue-on-error: true
      - name: What this run would change in the committed docs
        if: always()
        run: |
          mkdir -p data/review
          git diff -- README.md docs/models > data/review/docs-refresh.patch || true
          { echo "### Docs this run would change"; echo; git diff --stat -- README.md docs/models || true; echo; echo "The full patch is data/review/docs-refresh.patch in the run-evidence artifact."; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with: {name: run-evidence, path: "data/review/*\ndata/raw/*/manifest.json\ndata/raw/*/coverage.csv\ndata/check_history.csv\ndata/runs.csv\ndocs/data-governance.md\ndocs/schemas/*\ndocs/reconciliation/*\ndocs/figures/*"}
      - name: Open an issue when a scheduled run fails
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `Scheduled pipeline run failed (${new Date().toISOString().slice(0, 10)})`,
              body: `The scheduled extract and build did not finish cleanly.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nThe job summary lists the checks that did not pass; the run-evidence artifact has the tables.`,
            });
